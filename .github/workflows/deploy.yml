# Builds the site and publishes it to GitHub Pages.
# Needs, once: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until then this workflow fails at the deploy step and the
# old branch-based site keeps being served.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab
  schedule:
    - cron: '17 4 * * *' # daily, so new app releases and changelogs show up without a push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher GitHub API limit for release lookups
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
